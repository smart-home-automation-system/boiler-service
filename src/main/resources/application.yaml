spring:
  application:
    name: boiler-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/boiler"

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      probes:
        enabled: true

internal:
  service:
    heating-service:
      schema: http
      host: heating-service
      port: 6200
      path: "home/heating/status/active"
    water-service:
      schema: http
      host: water-service
      port: 6200
      path: "home/water/status/active"

shelly:
  actor:
    pro.boiler:
      host: 10.78.30.20
      port: 80
      relay:
        furnace: 0
        hot-water: 1
        heating: 2

logbook:
  format:
    style: json

logging:
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local

server:
  port: 6007
management:
  server:
    port: 8007

logbook:
  format:
    style: http

internal:
  service:
    heating-service:
      host: localhost
      port: 6002
    water-service:
      host: localhost
      port: 6006
