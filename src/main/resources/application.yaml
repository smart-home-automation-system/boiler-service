spring:
  application:
    name: boiler-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/boiler"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

internal:
  service:
    heating-service:
      schema: http
      host: heating-service
      port: 6200
      path: "home/heating/status/active"
    water-service:
      schema: http
      host: water-service
      port: 6200
      path: "home/water/status/active"

shelly:
  actor:
    pro.boiler:
      host: 10.78.30.20
      port: 80
      relay:
        furnace: 0
        hot-water: 1
        heating: 2

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local

server:
  port: 6007
management:
  server:
    port: 8007

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

internal:
  service:
    heating-service:
      host: localhost
      port: 6002
    water-service:
      host: localhost
      port: 6006
