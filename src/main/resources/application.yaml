spring:
  application:
    name: boiler-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home/boiler"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  # the only thing this service does on the broker is publishing notifications, so its one
  # connection goes straight to their virtual host
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    username: notification
    # no default on purpose: with one the pod would start, turn Ready and fail every publish.
    # Without the variable the service does not start - cholewa.required-properties sees to that, the
    # binder alone would take the placeholder for the password
    password: ${rabbitmq-password}
    virtual-host: /notification
    connection-timeout: 10s
    requested-heartbeat: 10s
    # a send that returns proves nothing: the broker confirms an unroutable message too. With
    # correlated confirms and returns the publisher learns whether the message is in a queue
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      # defaults to false; without it the published message carries no traceparent and the
      # trace of the control pass stops at the queue
      observation-enabled: true

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

internal:
  service:
    heating-service:
      schema: http
      host: heating-service
      port: 6200
      path: "home/heating/status/active"
    water-service:
      schema: http
      host: water-service
      port: 6200
      path: "home/water/status/active"

# the notification publisher of cholewa-commons, over the one connection above. It refuses to
# start without the confirms, the returns and the mandatory flag set there
cholewa:
  # refuses the start before the first bean when the password of the broker has no value (HAS-306,
  # in place of the own BrokerPasswordCheck of HAS-217)
  required-properties:
    - property: spring.rabbitmq.password
      variable: rabbitmq-password
  notification:
    enabled: true
    # a headers exchange, and "env" is one of the two headers it routes by
    exchange: notification
    env: prod
    # a broker that confirms later than this gets the same message again with the next pass
    confirm-timeout: 10s

boiler:
  shelly-monitor:
    # a bare number is minutes. How long every call to the Shelly may fail before the
    # household is told - a restart or a firmware update of the device fits in
    offline-after: 5m
    reminder-interval: 1h

shelly:
  # shelly-client >= 2.0.0 brings its own clients and MQTT decoder; this service keeps its ShellyClient
  client:
    enabled: false
  actor:
    pro.boiler:
      host: 10.78.30.20
      port: 80
      relay:
        furnace: 0
        hot-water: 1
        heating: 2

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost
    # a run on a workstation starts without the variable; it takes the real password only to
    # publish a notification
    password: ${rabbitmq-password:dummyPassword}

server:
  port: 6007
management:
  server:
    port: 8007

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

internal:
  service:
    heating-service:
      host: localhost
      port: 6002
    water-service:
      host: localhost
      port: 6006

cholewa:
  notification:
    env: dev

---

spring:
  config:
    activate:
      on-profile: test
  # nothing connects to the broker in a test: the connection is opened by the first publish
  rabbitmq:
    password: dummy

# second line of defence: SchedulingConfig does not schedule the control pass under this profile,
# and should anything in a test call the Shelly client anyway, it must not reach the real device
shelly:
  actor:
    pro.boiler:
      host: localhost
      port: 1

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
